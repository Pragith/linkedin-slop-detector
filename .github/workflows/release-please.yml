name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release_please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-release:
    needs: release_please
    if: ${{ needs.release_please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release_please.outputs.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate tagged source
        env:
          RELEASE_TAG: ${{ needs.release_please.outputs.tag_name }}
        run: |
          npm audit --audit-level=high
          npm run compile
          npm run lint
          npm run format:check
          npm test
          npm run version:check

      - name: Build and package release archives
        run: |
          npm run build:all
          npm run zip:all

      - name: Verify generated manifest versions
        env:
          RELEASE_TAG: ${{ needs.release_please.outputs.tag_name }}
        run: |
          npm run version:check
          npm run artifacts:check

      - name: Attach browser archives and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release_please.outputs.tag_name }}
        run: gh release upload "$RELEASE_TAG" build/release/*
