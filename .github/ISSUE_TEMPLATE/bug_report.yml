name: Bug Report
description: Report unexpected behavior, false positives, or LinkedIn DOM breakages
title: 'fix: [short bug description]'
labels: ['bug']
body:
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clear explanation of what went wrong.
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser & Version
      options:
        - Google Chrome
        - Mozilla Firefox
        - Microsoft Edge
        - Brave / Opera / Other Chromium
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the issue on LinkedIn.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened instead?
    validations:
      required: true
